[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dros"
version = "2.1.0"
description = "Dharma Reasoning OS - ????蟡??ｆ▽??賹???????遴鬥撟唾?擗?"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Personal and Non-Commercial Free License (Not Open Source); Commercial Use Requires Separate License"}

dependencies = [
    "PyYAML>=6.0",
    "quart>=0.19.0",
    "quart-cors>=0.7.0",
    "uvicorn[standard]>=0.30.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
# ?秋撒??荒??Ｙ?賹?賹???dros = "main:main"
