[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vajraclaw"
version = "2.1.0"
authors = [
  { name="Top-Celestial Company Ltd.", email="service@dr-os.io" },
]
description = "Deterministic runtime governance & in-band microsecond execution guardrail for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://dr-os.io"
"Bug Tracker" = "https://github.com/Top-Celestial-Company-Ltd/DROS-VajraClaw-Hacker/issues"
"Source" = "https://github.com/Top-Celestial-Company-Ltd/DROS-VajraClaw-Hacker"
