version: '3.8'

services:
  dros-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dros/hacker-gateway:v2.2.0
    container_name: dros-hacker-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DROS_POLICY_PATH=/app/dros.personal.config.json
      - DROS_LICENSE_KEY=${DROS_LICENSE_KEY:-}
    volumes:
      - ../dros.personal.config.json:/app/dros.personal.config.json:ro
      - ../logs:/app/logs:rw
